name: Publish to pub.dev

on:
  push:
    tags:
      - 're_convex-v[0-9]+.[0-9]+.[0-9]+*'
      - 're_convex_generator-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Exchanges the GitHub OIDC token for a pub.dev token.
      - uses: dart-lang/setup-dart@v1
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      # The tag names the package: re_convex-v0.1.0 publishes re_convex.
      - id: package
        run: echo "name=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
      - run: flutter test
        if: steps.package.outputs.name == 're_convex'
        working-directory: packages/re_convex
      - run: dart test
        if: steps.package.outputs.name == 're_convex_generator'
        working-directory: packages/re_convex_generator
      - run: dart pub publish --force
        working-directory: packages/${{ steps.package.outputs.name }}
