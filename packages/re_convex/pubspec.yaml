name: re_convex
description: "Flutter port of the official Convex React Native client: realtime queries over a WebSocket, mutations with optimistic updates, actions, pagination and auth. No Rust bridge."
version: 0.1.0
repository: https://github.com/ReAppIt/ReConvex/tree/main/packages/re_convex
issue_tracker: https://github.com/ReAppIt/ReConvex/issues
topics:
  - convex
  - realtime
  - websocket
  - backend
  - flutter
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

platforms:
  android:
  ios:

dependencies:
  clock: ^1.1.1
  connectivity_plus: ^7.0.0
  dio: ^5.8.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.0
  logging: ^1.3.0
  meta: ^1.15.0
  web_socket: ^1.0.1

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
